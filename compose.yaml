services:
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - socially-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socially_trade
      POSTGRES_USER: socially
      POSTGRES_PASSWORD: socially
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - socially-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socially -d socially_trade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  socially-redis:
  socially-postgres:
