services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socially_trade
      POSTGRES_USER: socially
      POSTGRES_PASSWORD: socially
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - socially-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socially -d socially_trade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  socially-postgres:
