[workspace]
resolver = "3"
members = ["programs/*"]

[workspace.package]
edition = "2021"
# litesvm 0.16 needs 1.90 (solana-syscalls uses MaybeUninit::write_copy_of_slice).
# resolver = "3" reads this value to select dependency versions this compiler can build.
rust-version = "1.90.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
