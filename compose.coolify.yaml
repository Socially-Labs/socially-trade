# Coolify production topology. compose.yaml is the local datastores and is not included.
# Commands are role names. socially is the only starter.

x-backend: &backend
  image: socially-backend
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  # A required interpolation is how Coolify creates the variable and injects it.
  # env_file alone does not register the name, so migrate exited 1 with the reason omitted.
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required. Use the internal Postgres URL.}
    REDIS_URL: ${REDIS_URL:?REDIS_URL is required. Use the internal Redis URL.}
    SWAP_ENABLED: ${SWAP_ENABLED:?Set SWAP_ENABLED=false unless this API is on Solana devnet.}
  stop_grace_period: 30s
  # Internal Postgres and Redis names resolve on the destination network.
  # default stays so the Coolify proxy can still reach the API.
  networks:
    - default
    - coolify

services:
  api:
    <<: *backend
    command: ["api"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  worker:
    <<: *backend
    command: ["worker"]
    restart: unless-stopped
    # service_healthy marks a crash-loop unhealthy in about a second and
    # compose up -d exits before the API stderr is kept. service_started
    # leaves that stderr in the API logs.
    depends_on:
      api:
        condition: service_started

  ingestor:
    <<: *backend
    command: ["ingestor"]
    # Leader connection loss returns exit 0. on-failure would not start it again.
    restart: always
    depends_on:
      api:
        condition: service_started

networks:
  coolify:
    name: ${COOLIFY_NETWORK:-coolify}
    external: true
