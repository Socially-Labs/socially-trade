# Coolify production topology with private, persistent datastores.
# Commands are role names. socially is the only starter.

x-backend: &backend
  image: socially-backend
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  # A required interpolation is how Coolify creates the variable and injects it.
  # env_file alone does not register the name, so migrate exited 1 with the reason omitted.
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required. Use the internal Postgres URL.}
    REDIS_URL: ${REDIS_URL:?REDIS_URL is required. Use the internal Redis URL.}
    SWAP_ENABLED: ${SWAP_ENABLED:?Set SWAP_ENABLED=false unless this API is on Solana devnet.}
  stop_grace_period: 30s
  # Coolify connects this stack and its proxy through the application network.
  # Do not join the shared coolify network: generic postgres/redis aliases there
  # may resolve to another application's datastore.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: socially_trade
      POSTGRES_USER: socially
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password in Coolify.}
    volumes:
      - socially-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "socially", "-d", "socially_trade"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - socially-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: ["api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  worker:
    <<: *backend
    command: ["worker"]
    restart: unless-stopped
    # API liveness begins only after the database migrations complete.
    depends_on:
      api:
        condition: service_healthy

  ingestor:
    <<: *backend
    command: ["ingestor"]
    # Leader connection loss returns exit 0. on-failure would not start it again.
    restart: always
    depends_on:
      api:
        condition: service_healthy

volumes:
  socially-postgres:
  socially-redis:
